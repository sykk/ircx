[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sykk/ircx"

[workspace.dependencies]
ircx-proto = { path = "crates/ircx-proto" }
ircx-ipc = { path = "crates/ircx-ipc" }
ircx-net = { path = "crates/ircx-net" }
ircx-core = { path = "crates/ircx-core" }
ircx-store = { path = "crates/ircx-store" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
# The whole HTTP client behind attachment previews: `http` for URL parsing,
# `httparse` for the response head, and the rustls above for the transport.
# Anything larger would have brought a second TLS configuration with it.
http = "1"
httparse = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panic = "abort" is deliberately absent. ircx-core supervises one task per
# network so a panic reports as that network failing instead of taking the
# process down, and aborting would defeat that in exactly the builds users run.
