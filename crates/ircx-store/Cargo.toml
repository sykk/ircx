[package]
name = "ircx-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ircx-ipc.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }

[dev-dependencies]
time.workspace = true
# `cold_archive.rs` drops the page cache with `posix_fadvise` and checks the
# drop with `mincore`. Neither has a std equivalent, and the crate is already
# in the tree several times over.
libc = "0.2"
# `two_connections.rs` needs an archive on disk. An in-memory one has a single
# connection, so it cannot reach what that file is about.
tempfile = "3"
