[package]
name = "ircx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Modern IRCv3 desktop client"

[lib]
name = "ircx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already in the tree under rustls; the file's name needs bytes nobody can guess.
ring = "0.17"
notify-rust = "4.18"
ircx-ipc.workspace = true
ircx-core.workspace = true
ircx-net.workspace = true
ircx-store.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
# `tray-icon` builds the status icon; `image-png` is what reads the marked
# variant of it out of the binary.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Already in the tree under tauri, which draws the window with it. Named here to
# reach the ATK signal a screen reader hears; see `announce.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# A walk-only escape from the single-instance lock, so a second ircx on this
# machine does not make every launch exit 0 and hand off to the first.
[features]
walk = []

[dev-dependencies]
tempfile = "3"
# `start_paused`, so a test can let the round-trip deadline pass without
# spending a minute of the suite on it.
tokio = { workspace = true, features = ["test-util"] }
