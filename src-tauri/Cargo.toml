[package]
name = "ircx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight modern IRCv3 desktop client"

[lib]
name = "ircx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already in the tree under rustls; the file's name needs bytes nobody can guess.
ring = "0.17"
ircx-ipc.workspace = true
ircx-core.workspace = true
ircx-net.workspace = true
ircx-store.workspace = true
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
