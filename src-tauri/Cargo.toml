[package]
name = "ircx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight modern IRCv3 desktop client"

[lib]
name = "ircx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already in the tree under rustls; the file's name needs bytes nobody can guess.
ring = "0.17"
ircx-ipc.workspace = true
ircx-core.workspace = true
ircx-net.workspace = true
ircx-store.workspace = true
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Already in the tree under tauri, which draws the window with it. Named here to
# reach the ATK signal a screen reader hears; see `announce.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
